<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-primary: #09090b;
      --bg-secondary: #18181b;
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --border: #27272a;
      --emerald: #10b981;
    }
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 24px;
      height: 24px;
    }
    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    .btn-dashboard {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background-color 0.15s ease;
    }
    .btn-dashboard:hover {
      background-color: var(--accent-hover);
    }
    .content {
      padding: 16px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 0;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
      min-height: 80px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: #3f3f46 transparent;
    }
    .activity-list::-webkit-scrollbar {
      width: 5px;
    }
    .activity-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .activity-list::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 4px;
    }
    .activity-list::-webkit-scrollbar-thumb:hover {
      background: #52525b;
    }
    .activity-item {
      display: flex;
      gap: 10px;
      font-size: 12px;
      line-height: 1.4;
    }
    .activity-icon {
      color: var(--emerald);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .activity-details {
      display: flex;
      flex-direction: column;
    }
    .activity-text {
      color: var(--text-primary);
    }
    .activity-text strong {
      font-weight: 600;
    }
    .activity-subject {
      color: var(--text-secondary);
      font-size: 11px;
      margin-top: 1px;
    }
    .activity-time {
      color: var(--text-secondary);
      font-size: 10px;
      margin-top: 2px;
    }
    .no-activity {
      text-align: center;
      color: var(--text-secondary);
      font-size: 12px;
      padding: 20px 0;
      font-style: italic;
    }
    .footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background-color: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
    }
    /* Switch toggle styling */
    .switch-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #3f3f46;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--emerald);
    }
    input:checked + .slider:before {
      transform: translateX(14px);
    }
    .loading-spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
      color: var(--text-secondary);
      font-size: 12px;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <!-- Embedded SVG Logo -->
      <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="pop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="45" fill="url(#pop-grad)" />
        <path d="M22 50 C 32 32, 68 32, 78 50 C 68 68, 32 68, 22 50 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M43 50 L48 55 L58 43" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="brand-name">Dekha Kya?</span>
    </div>
    <button class="btn-dashboard" id="btn-dashboard">
      Dashboard
    </button>
  </div>

  <div class="content">
    <div class="section-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-top: -1px;">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
      Latest Activity
    </div>
    <div class="activity-list" id="activity-list">
      <div class="loading-spinner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="animation: spin 1s linear infinite;">
          <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
          <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.49 8.49l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.49-8.49l2.83-2.83"/>
        </svg>
        Loading activity...
      </div>
    </div>
  </div>

  <div class="footer">
    <span>v1.0.0</span>
    <div class="switch-container">
      <span id="status-label">Tracking enabled</span>
      <label class="switch">
        <input type="checkbox" id="tracking-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script src="dist/popup.js"></script>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
